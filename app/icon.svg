<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Navy background -->
  <rect width="32" height="32" rx="6" fill="#0d1c28"/>

  <!-- Bar 1 – short, white -->
  <rect x="4"  y="18" width="5" height="11" rx="1.5" fill="#ffffff"/>
  <!-- Bar 2 – medium, white -->
  <rect x="13" y="11" width="5" height="18" rx="1.5" fill="#ffffff"/>
  <!-- Bar 3 – tall, accent orange -->
  <rect x="22" y="4"  width="5" height="25" rx="1.5" fill="#c8622a"/>

  <!-- Diagonal accent connector -->
  <line x1="6.5" y1="18" x2="24.5" y2="4" stroke="#c8622a" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
</svg>
